version: "3.8"

# Cấu hình log rotation toàn cục để tránh tràn đĩa cứng trên VPS
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: datn-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging

  # 2. Graph Database Neo4j
  neo4j:
    image: neo4j:5-community
    container_name: datn-neo4j
    restart: always
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_initial_dbms_default__database=${NEO4J_DATABASE}
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
    logging: *default-logging

  # 3. AI Pipeline (FastAPI)
  ai-pipeline:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWERCASE}/ai-pipeline:latest
    container_name: datn-ai-pipeline
    restart: always
    ports:
      - "8001:8001"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE}
      - STT_PROVIDER=${STT_PROVIDER}
    depends_on:
      - neo4j
    volumes:
      - shared_uploads:/app/uploads
    logging: *default-logging

  # 4. Spring Boot Backend
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWERCASE}/backend:latest
    container_name: datn-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - APP_TUTOR_AI_BASE_URL=http://ai-pipeline:8001
      - APP_TUTOR_BROWSER_TTS=true
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_JWT_ACCESS_TOKEN_EXPIRATION=${APP_JWT_ACCESS_TOKEN_EXPIRATION}
      - APP_JWT_REFRESH_TOKEN_EXPIRATION=${APP_JWT_REFRESH_TOKEN_EXPIRATION}
    depends_on:
      - postgres
      - ai-pipeline
    volumes:
      - shared_uploads:/app/uploads
    logging: *default-logging

  # 5. Frontend (Nginx serve Vue)
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWERCASE}/frontend:latest
    container_name: datn-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    logging: *default-logging

  # 6. Dozzle - Real-time Log Viewer (Dịch vụ giám sát Log cơ bản qua giao diện Web)
  dozzle:
    image: amir20/dozzle:latest
    container_name: datn-dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080" # Truy cập xem log tại cổng 8888 trên VPS
    environment:
      - DOZZLE_LEVEL=info
    logging: *default-logging

  # 7. Netdata - Real-time Performance Monitoring (Giám sát tài nguyên máy chủ & container qua Docker)
  netdata:
    image: netdata/netdata:stable
    container_name: datn-netdata
    restart: always
    hostname: vps-monitoring
    ports:
      - "19999:19999" # Truy cập dashboard giám sát tại cổng 19999 trên VPS
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging

volumes:
  postgres_data:
  neo4j_data:
  neo4j_import:
  shared_uploads:
  netdataconfig:
  netdatalib:
  netdatacache:
