name: Deploy to VPS (Docker Registry Build & Push)

on:
  push:
    branches:
      - main  # Hoặc master tùy vào nhánh chính của bạn

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Chuyển đổi tên repo sang chữ thường để tránh lỗi Docker tag không cho phép chữ in hoa
      - name: Downcase Repo Name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build & Push AI Pipeline Image
      - name: Build and push AI Pipeline
        uses: docker/build-push-action@v5
        with:
          context: ./ai/python_pipeline
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/ai-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Spring Boot Backend Image
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push Vue Frontend Image
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (to copy docker-compose.prod.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "/var/www/DATN/"

      - name: Pull and Run on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/DATN
            
            # Log in vào GHCR ngay trên VPS để pull các private package
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Khai báo biến môi trường cho Docker Compose để map chính xác tên image lowercase
            export GITHUB_REPOSITORY_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # Pull các image mới nhất từ Registry về VPS
            docker compose -f docker-compose.prod.yml pull
            
            # Restart các container chạy image mới mà không ảnh hưởng database
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Dọn dẹp Docker images cũ để tránh đầy ổ đĩa VPS
            docker image prune -f
            docker logout ghcr.io

