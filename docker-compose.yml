version: "3.8"

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: datn-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Graph Database Neo4j
  neo4j:
    image: neo4j:5-community
    container_name: datn-neo4j
    restart: always
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_initial_dbms_default__database=${NEO4J_DATABASE}
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import

  # 3. AI Pipeline (FastAPI)
  ai-pipeline:
    build:
      context: ./ai/python_pipeline
    container_name: datn-ai-pipeline
    restart: always
    ports:
      - "8001:8001"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE}
      - STT_PROVIDER=${STT_PROVIDER}
    depends_on:
      - neo4j
    volumes:
      - shared_uploads:/app/uploads

  # 4. Spring Boot Backend
  backend:
    build:
      context: ./backend
    container_name: datn-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - APP_TUTOR_AI_BASE_URL=http://ai-pipeline:8001
      - APP_TUTOR_BROWSER_TTS=true
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_JWT_ACCESS_TOKEN_EXPIRATION=${APP_JWT_ACCESS_TOKEN_EXPIRATION}
      - APP_JWT_REFRESH_TOKEN_EXPIRATION=${APP_JWT_REFRESH_TOKEN_EXPIRATION}
    depends_on:
      - postgres
      - ai-pipeline
    volumes:
      - shared_uploads:/app/uploads

  # 5. Frontend (Nginx serve Vue)
  frontend:
    build:
      context: ./frontend
    container_name: datn-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_import:
  shared_uploads:
