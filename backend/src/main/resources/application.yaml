spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/datn}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${APP_JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes in ms
    refresh-token-expiration: ${APP_JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days in ms
  translate:
    quick-url: https://translate.googleapis.com/translate_a/single
  tutor:
    ai-base-url: ${APP_TUTOR_AI_BASE_URL:http://localhost:8001}
    browser-tts: ${APP_TUTOR_BROWSER_TTS:true}
